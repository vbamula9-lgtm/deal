<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BARTER VERSE — Peer-to-Peer Value Exchange</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #050508;
            --teal: #00f2fe;
            --amber: #ff9900;
            --card-bg: rgba(18, 18, 28, 0.95);
            --border: rgba(255, 255, 255, 0.15);
        }

        body {
            background-color: var(--bg);
            color: #f0f0f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        .ambient-light {
            position: fixed;
            width: 80vw;
            height: 80vw;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.08) 0%, rgba(255, 153, 0, 0.05) 50%, transparent 70%);
            top: -20vw;
            left: 10vw;
            pointer-events: none;
            z-index: 0;
            filter: blur(80px);
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 16px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(5, 5, 8, 0.85);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 900;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #fff, var(--teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 20px;
            list-style: none;
        }

        .nav-links a {
            color: #a0a0b0;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--teal);
        }

        .cta-btn {
            background: linear-gradient(135deg, var(--teal), #4facfe);
            color: #000;
            font-weight: 700;
            padding: 10px 20px;
            font-size: 0.8rem;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.7);
        }

        .hero {
            position: relative;
            height: 220vh;
        }

        .sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 0 16px;
        }

        .hero-heading {
            position: absolute;
            top: 12%;
            text-align: center;
            z-index: 10;
            transition: opacity 0.3s;
            width: 90%;
        }

        .hero-heading h1 {
            font-size: clamp(1.8rem, 6vw, 3.8rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .hero-heading p {
            color: #8a8a9e;
            font-size: clamp(0.85rem, 2.5vw, 1.05rem);
            letter-spacing: 1px;
        }

        .assembly-stage {
            position: relative;
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .trade-card {
            position: absolute;
            width: clamp(200px, 68vw, 280px);
            height: clamp(270px, 80vw, 360px);
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            will-change: transform;
            transition: border-color 0.4s, box-shadow 0.4s;
        }

        .card-left {
            transform: translateX(-100vw) rotate(-20deg);
        }

        .card-right {
            transform: translateX(100vw) rotate(20deg);
        }
